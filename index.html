    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f3;
      --surface: #ebebea;
      --border: #ddd;
      --text-primary: #111;
      --text-secondary: #999;
      --gap: 2px;
      --radius: 4px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 0.02em;
      min-height: 100vh;
    }

    /* ── Fade overlay for page transitions ── */
    #fade {
      position: fixed;
      inset: 0;
      background: var(--bg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
      z-index: 99;
    }
    #fade.on { opacity: 1; pointer-events: all; }

    /* ── Header ── */
    header {
      padding: 48px 48px 32px;
      border-bottom: 1px solid var(--border);
      transition: opacity 0.3s ease;
    }

    body.work-open header {
      display: none;
    }

    /* ── Sticky scroll-up bar ── */
    #scroll-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 90;
      padding: 14px 48px;
      background: rgba(245, 245, 243, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      opacity: 0;
      transform: translateY(-100%);
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.25, 0, 0, 1);
      pointer-events: none;
    }

    #scroll-nav.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    @media (max-width: 600px) {
      #scroll-nav { padding: 12px 20px; }
    }

    .title-block h1 {
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .title-block p {
      margin-top: 8px;
      color: var(--text-secondary);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Views ── */
    .view { display: none; }
    .view.active { display: block; }

    /* ── Featured Genway tiles ── */
    .featured-section {
      display: flex;
      gap: 6px;
      padding: 24px 24px 0;
    }

    .featured-tile {
      flex: 1;
      aspect-ratio: 1 / 1;
      background: var(--surface) center/cover no-repeat;
      border-radius: var(--radius);
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.55s cubic-bezier(0.25, 0, 0, 1) both;
    }

    .featured-tile::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 40%, rgba(0,0,0,0.45));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .featured-tile:hover::after { opacity: 1; }

    .featured-label {
      position: relative;
      z-index: 1;
      padding: 16px 18px;
      font-size: clamp(13px, 1.4vw, 18px);
      font-weight: 300;
      letter-spacing: -0.01em;
      color: #fff;
      opacity: 0;
      transition: opacity 0.3s ease;
      text-shadow: 0 1px 8px rgba(0,0,0,0.4);
    }

    .featured-tile:hover .featured-label { opacity: 1; }

    .featured-tile.logo-tile {
      background: #fff;
      align-items: center;
      justify-content: center;
    }

    .featured-tile.logo-tile::after {
      background: rgba(0,0,0,0.04);
    }

    .featured-tile.logo-tile .featured-label {
      color: #111;
      text-shadow: none;
      position: absolute;
      bottom: 0; left: 0;
    }

    .featured-logo {
      width: 55%;
      height: 55%;
      object-fit: contain;
      position: relative;
      z-index: 0;
    }

    /* ── Section divider ── */
    .section-label {
      padding: 36px 48px 16px;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    /* ── Home gallery ── */
    .gallery {
      padding: 0 24px 24px;
      columns: 3 280px;
      column-gap: 6px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .gallery-item {
      break-inside: avoid;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      margin-bottom: 6px;
      background: var(--surface);
      border-radius: var(--radius);
      animation: fadeUp 0.55s cubic-bezier(0.25, 0, 0, 1) both;
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.5s cubic-bezier(0.25, 0, 0, 1);
    }

    .gallery-item:hover img { transform: scale(1.03); }

    .gallery-item .caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 40px 16px 14px;
      background: linear-gradient(transparent, rgba(0,0,0,0.5));
      color: #fff;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .gallery-item:hover .caption { opacity: 1; }

    /* ── Work detail view ── */
    #work-view { min-height: 100vh; }

    .work-nav {
      padding: 36px 48px 0;
    }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .back-btn:hover { color: var(--text-primary); }

    .back-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

    .work-content {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 48px 100px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .work-title {
      font-size: clamp(22px, 3vw, 40px);
      font-weight: 300;
      letter-spacing: -0.02em;
      margin-bottom: 36px;
    }

    /* Vimeo embed */
    .video-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      margin-bottom: 4px;
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
    }

    .video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      border: none;
    }

    .work-image {
      display: block;
      width: 100%;
      height: auto;
      border-radius: var(--radius);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .work-image.img-loaded { opacity: 1; }

    /* Shimmer skeleton shown while src hasn't been set yet */
    .work-image[data-src] {
      min-height: 320px;
      background: linear-gradient(
        90deg,
        var(--surface) 0%,
        #e4e4e2 50%,
        var(--surface) 100%
      );
      background-size: 200% 100%;
      animation: shimmer 1.6s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Lightbox overlay ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.88);
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }

    #lightbox.open {
      display: flex;
      animation: lbFadeIn 0.22s ease;
    }

    @keyframes lbFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    #lightbox img {
      max-width: min(92vw, 1400px);
      max-height: 92vh;
      object-fit: contain;
      border-radius: var(--radius);
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
      pointer-events: none;
      animation: lbScaleIn 0.22s cubic-bezier(0.25, 0, 0, 1);
    }

    @keyframes lbScaleIn {
      from { transform: scale(0.95); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    #lightbox-close {
      position: fixed;
      top: 20px;
      right: 24px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.7);
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
      transition: color 0.15s;
    }

    #lightbox-close:hover { color: #fff; }

    #lightbox-prev,
    #lightbox-next {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      font-size: 56px;
      line-height: 1;
      cursor: pointer;
      padding: 0 20px;
      transition: color 0.15s;
      user-select: none;
    }

    #lightbox-prev { left: 0; }
    #lightbox-next { right: 0; }
    #lightbox-prev:hover,
    #lightbox-next:hover { color: #fff; }

    #lightbox-counter {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      letter-spacing: 0.1em;
    }

    .work-image.zoomable {
      cursor: zoom-in;
    }

    @media (max-width: 600px) {
      header { padding: 28px 20px 20px; }
      .featured-section { flex-direction: column; }
      .featured-tile { min-height: 160px; }
      .section-label { padding: 28px 20px 12px; }
      .gallery { padding: 0 1px 1px; column-gap: 1px; }
      .gallery-item { margin-bottom: 1px; }
      .work-nav { padding: 24px 20px 0; }
      .work-content { padding: 28px 20px 60px; }
    }
  </style>
</head>

    <button id="lightbox-close" aria-label="Close">&#x2715;</button>
    <button id="lightbox-prev" aria-label="Previous">&#x2039;</button>
    <img id="lightbox-img" src="" alt="" />
    <button id="lightbox-next" aria-label="Next">&#x203a;</button>
    <div id="lightbox-counter"></div>
  </div>

  <script>
    // ── Lightbox ──
    const lightbox        = document.getElementById('lightbox');
    const lightboxImg     = document.getElementById('lightbox-img');
    const lightboxCounter = document.getElementById('lightbox-counter');
    const lightboxPrev    = document.getElementById('lightbox-prev');
    const lightboxNext    = document.getElementById('lightbox-next');

    let lbImages = [];  // array of { src, alt }
    let lbIndex  = 0;

    function showLightboxAt(index) {
      lbIndex = (index + lbImages.length) % lbImages.length;
      lightboxImg.src = lbImages[lbIndex].src;
      lightboxImg.alt = lbImages[lbIndex].alt;
      lightboxCounter.textContent = `${lbIndex + 1} / ${lbImages.length}`;
      lightboxPrev.style.visibility = lbImages.length > 1 ? 'visible' : 'hidden';
      lightboxNext.style.visibility = lbImages.length > 1 ? 'visible' : 'hidden';
    }

    function openLightbox(images, startIndex) {
      lbImages = images;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
      showLightboxAt(startIndex);
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    lightbox.addEventListener('click', e => {
      if (e.target === lightbox || e.target === lightboxImg) closeLightbox();
    });
    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    lightboxPrev.addEventListener('click', e => { e.stopPropagation(); showLightboxAt(lbIndex - 1); });
    lightboxNext.addEventListener('click', e => { e.stopPropagation(); showLightboxAt(lbIndex + 1); });

    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape')      closeLightbox();
      if (e.key === 'ArrowRight')  showLightboxAt(lbIndex + 1);
      if (e.key === 'ArrowLeft')   showLightboxAt(lbIndex - 1);
    });
  </script>

        <span class="caption">${work.title}</span>
      `;
      item.addEventListener('click', () => openWork(work));
      gallery.appendChild(item);
    });

    // ── Transitions ──
    const fade = document.getElementById('fade');
    const homeView = document.getElementById('home-view');
    const workView = document.getElementById('work-view');
    const workContent = document.getElementById('work-content');

    function transition(show, hide, before) {
      fade.classList.add('on');
      setTimeout(() => {
        hide.classList.remove('active');
        before();
        show.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'instant' });
        requestAnimationFrame(() => {
          fade.classList.remove('on');
        });
      }, 280);
    }

    function openWork(work) {
      transition(workView, homeView, () => {
        document.body.classList.add('work-open');
        workContent.innerHTML = '';

        const title = document.createElement('h2');
        title.className = 'work-title';
        title.textContent = work.title;
        workContent.appendChild(title);

        if (work.vimeoId) {
          const wrap = document.createElement('div');
          wrap.className = 'video-wrap';
          wrap.innerHTML = `<iframe
            src="https://player.vimeo.com/video/${work.vimeoId}?color=111&title=0&byline=0&portrait=0"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen
          ></iframe>`;
          workContent.appendChild(wrap);
        }

        const zoomable = work.id === 'Genway-UI';
        const lbList = zoomable ? work.images.map(s => ({ src: s, alt: work.title })) : [];

        // First image loads immediately; the rest load as the user scrolls
        work.images.forEach((src, i) => {
          const img = document.createElement('img');
          img.className = 'work-image' + (zoomable ? ' zoomable' : '');
          img.alt = work.title;
          if (zoomable) {
            img.addEventListener('click', () => openLightbox(lbList, i));
          }
          if (i === 0) {
            img.src = src;
            img.onload = () => img.classList.add('img-loaded');
            if (img.complete) img.classList.add('img-loaded');
          } else {
            img.dataset.src = src; // triggers shimmer skeleton via CSS
          }
          workContent.appendChild(img);
        });

        // Intersection Observer: reveal images 400px before they enter viewport
        const lazyIO = new IntersectionObserver((entries, observer) => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            const img = entry.target;
            img.src = img.dataset.src;
            delete img.dataset.src;
            img.onload = () => img.classList.add('img-loaded');
            if (img.complete) img.classList.add('img-loaded');
            observer.unobserve(img);
          });
        }, { rootMargin: '0px 0px 400px 0px' });

        // rAF lets the browser compute layout before we observe,
        // so off-screen images don't all fire immediately
        requestAnimationFrame(() => {
          workContent.querySelectorAll('img[data-src]').forEach(img => lazyIO.observe(img));
        });
      });
    }

    function goHome() {
      scrollNav.classList.remove('visible');
      transition(homeView, workView, () => {
        document.body.classList.remove('work-open');
        workContent.innerHTML = '';
        // Re-trigger gallery stagger animation
        document.querySelectorAll('.gallery-item').forEach((item, i) => {
          item.style.animation = 'none';
          item.offsetHeight;
          item.style.animation = '';
          item.style.animationDelay = `${i * 0.045}s`;
        });
      });
    }

    document.getElementById('back-btn').addEventListener('click', goHome);
    document.getElementById('scroll-back-btn').addEventListener('click', goHome);

    // ── Scroll-up sticky nav ──
    const scrollNav = document.getElementById('scroll-nav');
    let lastY = 0;
    let ticking = false;

    window.addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const y = window.scrollY;
        const inWorkView = document.body.classList.contains('work-open');
        if (inWorkView && y > 80 && y < lastY) {
          scrollNav.classList.add('visible');
        } else {
          scrollNav.classList.remove('visible');
        }
        lastY = y;
        ticking = false;
      });
    });
  </script>
</body>
</html>
